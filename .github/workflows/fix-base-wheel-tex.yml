name: Fix base-wheel LaTeX line breaks
on:
  push:
    branches:
      - experiment/p2-plus-1-patterns
    paths:
      - .github/workflows/fix-base-wheel-tex.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p2-plus-1-patterns
      - name: Diagnose and normalize stray text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experiments/BASE_WHEEL_Q7919_SWEEP_STUDY.tex')
          s = p.read_text(encoding='utf-8')
          for word in ('يعطي:', 'يصبح', 'بدل:'):
              pos = s.find(word)
              sample = s[max(0,pos-12):pos+len(word)+3]
              print(word, 'repr=', repr(sample))
              print(word, 'codes=', [hex(ord(c)) for c in sample])
              if pos >= 2 and s[pos-2:pos] == '\\n':
                  s = s[:pos-2] + '\n' + s[pos:]
              elif pos >= 1 and s[pos-1] == '\\':
                  s = s[:pos-1] + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/BASE_WHEEL_Q7919_SWEEP_STUDY.tex
          git diff --cached --quiet || git commit -m "fix: remove stray LaTeX text before Arabic prose"
          git push
