name: Fix base-wheel LaTeX line breaks
on:
  push:
    branches:
      - experiment/p2-plus-1-patterns
    paths:
      - .github/workflows/fix-base-wheel-tex.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p2-plus-1-patterns
      - name: Remove accidental backslash-Arabic-noon sequences
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experiments/BASE_WHEEL_Q7919_SWEEP_STUDY.tex')
          s = p.read_text(encoding='utf-8')
          before = s.count('\\ن')
          s = s.replace('\\ن', '\n')
          print('replacements:', before)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+scientifica007@users.noreply.github.com"
          git add experiments/BASE_WHEEL_Q7919_SWEEP_STUDY.tex
          git diff --cached --quiet || git commit -m "fix: remove stray Arabic-noon escapes from LaTeX report"
          git push
