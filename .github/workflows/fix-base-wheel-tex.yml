name: Fix base-wheel LaTeX line breaks
on:
  push:
    branches:
      - experiment/p2-plus-1-patterns
    paths:
      - .github/workflows/fix-base-wheel-tex.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p2-plus-1-patterns
      - name: Normalize text after display-math blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('experiments/BASE_WHEEL_Q7919_SWEEP_STUDY.tex')
          s = p.read_text(encoding='utf-8')
          pattern = r'\\\](?:(?:\\n)|\s)*(?=(?:يعطي:|يصبح|بدل:))'
          s2, n = re.subn(pattern, lambda m: "\\]\n", s)
          print('replacements:', n)
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/BASE_WHEEL_Q7919_SWEEP_STUDY.tex
          git diff --cached --quiet || git commit -m "fix: normalize LaTeX line breaks in base-wheel report"
          git push
