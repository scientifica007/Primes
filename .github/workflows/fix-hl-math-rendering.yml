name: Fix HL math rendering

on:
  push:
    branches:
      - experiment/p2-plus-1-patterns

permissions:
  contents: write

jobs:
  fix-math:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p2-plus-1-patterns
      - name: Replace raw less-than signs in product subscripts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('experiments/HL_SINGULAR_SERIES_POINT_MODEL.md')
          text = path.read_text(encoding='utf-8')
          text2 = text.replace(r'997<r\le Q', r'997\lt r\le Q')
          if text2 == text:
              raise SystemExit('Expected math patterns were not found; refusing a no-op commit.')
          path.write_text(text2, encoding='utf-8')
          print('Replaced', text.count(r'997<r\le Q'), 'occurrences')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/HL_SINGULAR_SERIES_POINT_MODEL.md
          git rm .github/workflows/fix-hl-math-rendering.yml
          git commit -m 'fix: make HL product bounds render on GitHub'
          git push
