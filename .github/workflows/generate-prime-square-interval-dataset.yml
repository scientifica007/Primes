name: Generate prime-square interval dataset

on:
  push:
    branches:
      - experiment/p2-plus-1-patterns
    paths:
      - .github/workflows/generate-prime-square-interval-dataset.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment/p2-plus-1-patterns
          fetch-depth: 0

      - name: Generate datasets
        run: python3 experiments/generate_prime_square_interval_dataset.py

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/primes_up_to_1001st_prime_square.csv \
            experiments/first_1000_prime_square_interval_index.csv \
            experiments/first_20_prime_square_interval_lists_preview.csv \
            experiments/PRIME_SQUARE_INTERVAL_DATASET.md
          git commit -m "Generate first 1000 prime-square interval dataset" || exit 0
          git push origin HEAD:experiment/p2-plus-1-patterns
