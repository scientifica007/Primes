name: Run prime-square randomness experiment

on:
  push:
    branches:
      - experiment/p2-plus-1-patterns
    paths:
      - .github/workflows/run-prime-square-randomness.yml
      - experiments/analyze_prime_square_interval_randomness.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p2-plus-1-patterns
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy matplotlib
      - name: Run experiment
        run: python experiments/analyze_prime_square_interval_randomness.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/prime_square_interval_randomness_results.csv \
            experiments/prime_square_interval_randomness_summary.csv \
            experiments/prime_square_interval_randomness_top_deviations.csv \
            experiments/prime_square_counts_observed_vs_expected.svg \
            experiments/prime_square_interval_standardized_residuals.svg \
            experiments/PRIME_SQUARE_INTERVAL_RANDOMNESS_EXPERIMENT.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add prime-square interval randomness experiment results"
            git push origin HEAD:experiment/p2-plus-1-patterns
          fi
