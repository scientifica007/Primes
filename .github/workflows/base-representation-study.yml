name: Base Representation Study

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Upper limit N"
        required: true
        default: "100000000"
        type: string
      sample_size:
        description: "Matched prime/composite sample for digit analysis"
        required: true
        default: "200000"
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib

      - name: Smoke test
        run: python base_representation_study.py 10000 --bases-max 20 --sample-size 2000 --output-dir smoke-output

      - name: Record environment
        run: |
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner arch: $RUNNER_ARCH"
            python --version
            python - <<'PY'
          import numpy, matplotlib
          print('NumPy:', numpy.__version__)
          print('Matplotlib:', matplotlib.__version__)
          PY
            uname -a
            lscpu
          } | tee base-study-environment.txt

      - name: Run full base study
        env:
          LIMIT: ${{ inputs.limit || '100000000' }}
          SAMPLE_SIZE: ${{ inputs.sample_size || '200000' }}
        run: |
          python base_representation_study.py "$LIMIT" \
            --bases-max 100 \
            --sample-size "$SAMPLE_SIZE" \
            --output-dir base-study-output | tee base-study-output.txt

      - name: Run digit null baseline
        env:
          LIMIT: ${{ inputs.limit || '100000000' }}
          SAMPLE_SIZE: ${{ inputs.sample_size || '200000' }}
        run: |
          python base_digit_null_study.py "$LIMIT" \
            --bases-max 100 \
            --sample-size "$SAMPLE_SIZE" \
            --output base-study-output/digit_null_baseline.csv \
            --summary base-study-output/digit_null_summary.json | tee base-study-null-output.txt

      - name: Add summary to job
        run: |
          {
            echo "## Base representation study"
            echo
            echo "**Commit:** \`$GITHUB_SHA\`"
            echo
            echo '```text'
            cat base-study-output.txt
            echo
            cat base-study-null-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload study artifacts
        uses: actions/upload-artifact@v4
        with:
          name: base-representation-study-${{ github.run_number }}
          path: |
            base-study-output/
            base-study-output.txt
            base-study-null-output.txt
            base-study-environment.txt
          retention-days: 90
