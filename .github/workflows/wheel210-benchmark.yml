name: Wheel-210 Benchmark

on:
  workflow_dispatch:
    inputs:
      limits:
        description: "Upper limits separated by spaces"
        required: true
        default: "100000 1000000 10000000"
        type: string
      repeats:
        description: "Repetitions per method and limit"
        required: true
        default: "1"
        type: string
      segment_units:
        description: "Candidate bits per segment for both methods"
        required: true
        default: "32768"
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wheel210-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record environment
        run: |
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner arch: $RUNNER_ARCH"
            python --version
            uname -a
            echo
            lscpu
          } | tee wheel210-environment.txt

      - name: Run independent verification
        run: python ci_verify.py 4999

      - name: Run Wheel-210 benchmark
        env:
          LIMITS: ${{ inputs.limits || '100000 1000000 10000000' }}
          REPEATS: ${{ inputs.repeats || '1' }}
          SEGMENT_UNITS: ${{ inputs.segment_units || '32768' }}
        run: |
          python benchmark_wheel210.py $LIMITS \
            --repeats "$REPEATS" \
            --segment-units "$SEGMENT_UNITS" \
            --csv wheel210-results.csv | tee wheel210-output.txt

      - name: Add results to summary
        run: |
          {
            echo "## Wheel-210 segmented benchmark"
            echo
            echo "**Commit:** \`$GITHUB_SHA\`"
            echo
            echo '```text'
            cat wheel210-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Wheel-210 benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel210-prime-benchmark-${{ github.run_number }}
          path: |
            wheel210-results.csv
            wheel210-output.txt
            wheel210-environment.txt
          retention-days: 90
