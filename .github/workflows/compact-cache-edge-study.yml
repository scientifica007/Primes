name: Compact Wheel Cache Edge Study

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify compact wheel
        run: python -m unittest -v test_compact_primorial_wheel.py

      - name: Focused sweep beyond 1 MiB
        run: |
          python benchmark_compact_cache_wheels.py 100000000 \
            --segment-bytes 1048576,2097152,4194304,8388608 \
            --repeats 2 \
            --legacy-limit 100000 \
            --legacy-segment-bytes 4096 \
            --csv compact-cache-edge-sweep.csv \
            --best-csv compact-cache-edge-best.csv \
            --legacy-csv compact-cache-edge-legacy.csv | tee compact-cache-edge-output.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: compact-wheel-cache-edge-${{ github.run_number }}
          path: |
            compact-cache-edge-sweep.csv
            compact-cache-edge-best.csv
            compact-cache-edge-output.txt
          retention-days: 90
